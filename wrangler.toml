name = "furex-erp"
main = "worker.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Configurez votre base Cloudflare D1 :
# 1. npx wrangler d1 create furex-erp-db
# 2. Renseignez database_id ci-dessous puis appliquez les migrations :
#    npx wrangler d1 migrations apply furex-erp-db --remote
# 3. Définissez votre secret de session :
#    npx wrangler secret put SESSION_SECRET
[[d1_databases]]
binding = "DB"
database_name = "furex-erp-db"
database_id = "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
